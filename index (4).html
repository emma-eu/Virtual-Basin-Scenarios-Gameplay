&lt;style&gt;
  #basin-gui { color-scheme: light dark; --b-bg: light-dark(#f6f3eb,#0b1418); --b-app: light-dark(#fffdfa,#111d22); --b-panel: light-dark(#f4f7f5,#16252b); --b-board: light-dark(#d5edf1,#17323b); --b-soft: light-dark(#e5eff0,#20343b); --b-line: light-dark(#a9c5cb,#3b5660); --b-text: light-dark(#123e4f,#edf6f7); --b-muted: light-dark(#536e77,#b9cbd0); --b-navy: light-dark(#123e4f,#78c4d8); --b-teal: light-dark(#218c91,#63ccc8); --b-teal-soft: light-dark(#d7ece8,#193b39); --b-blue: light-dark(#347f9c,#70badb); --b-blue-soft: light-dark(#e2f1f4,#1b3440); --b-orange: light-dark(#d48623,#eca34d); --b-green: light-dark(#48785b,#75bd94); --b-red: light-dark(#b84f52,#ef8585); --b-gray: light-dark(#6d8790,#9fb0b7); --b-purple: light-dark(#6f5b93,#ab97dd); --b-pink: light-dark(#a86484,#d798bc); --b-coral: light-dark(#e79596,#a74e51); --b-shadow: light-dark(rgba(18,62,79,.16),rgba(0,0,0,.35)); font-family:&quot;Arial Narrow&quot;,&quot;Roboto Condensed&quot;,Inter,ui-sans-serif,system-ui,sans-serif; color:var(--b-text); }

  .basin-mark { width:34px; height:34px; border:2px solid var(--b-teal); position:relative; transform:rotate(-3deg); }

  .basin-split { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }

  .basin-split strong { display:block; font-size:22px; }
  .basin-summary { display:grid; gap:9px; }
  .basin-summary &gt; div { display:flex; justify-content:space-between; gap:12px; padding:11px; border-bottom:1px solid var(--b-line); }
  .basin-badges { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin:14px 0; }
  .basin-badge { padding:12px; background:var(--b-app); border:2px solid var(--b-gray); border-radius:18px 18px 8px 8px; }
  .basin-badge.is-earned { background:var(--b-teal-soft); border-color:var(--b-orange); box-shadow:inset 0 0 0 2px var(--b-app); }
  .basin-badge strong, .basin-badge small { display:block; }
  .basin-badge small { color:var(--b-muted); margin-top:3px; }
  .basin-report { display:grid; gap:10px; }
  .basin-report label { color:var(--b-muted); font-size:12px; }
  .basin-report textarea { width:100%; min-height:76px; margin-top:5px; resize:vertical; padding:9px; color:var(--b-text); background:var(--b-panel); border:1px solid var(--b-line); border-radius:8px; }
  @media (max-width: 850px) {
    .basin-main { grid-template-columns:1fr 1.4fr; }
    .basin-score { grid-column:1 / -1; border-top:1px solid var(--b-line); }
    .basin-library { border-right:1px solid var(--b-line); }
    .basin-package { border-right:0; }
    .basin-session &gt; span:not(.basin-time) { display:none; }
  }
  @media (max-width: 590px) {
    .basin-topbar { align-items:flex-start; }
    .basin-session { gap:7px; }
    .basin-outline { display:none; }
    .basin-steps { grid-template-columns:1fr 1fr; }
    .basin-main { display:block; }
    .basin-library, .basin-package { border-right:0; border-bottom:1px solid var(--b-line); }
    .basin-slots { grid-template-columns:repeat(2,1fr); }
    .basin-phase-grid { grid-template-columns:1fr; }
  }
  @media print {
    #basin-gui { color-scheme:light; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .basin-app { box-shadow:none; }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;basin-gui&#x27;);
  let timeRemaining = 30 * 60;
  const renderTimer = () =&gt; {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    root.querySelector(&#x27;#basin-timer&#x27;).textContent = `${minutes}:${String(seconds).padStart(2,&#x27;0&#x27;)}`;
  };
  renderTimer();
  setInterval(() =&gt; { if(timeRemaining &gt; 0){ timeRemaining--; renderTimer(); } }, 1000);
  const strategies = [
    {id:&#x27;lease&#x27;,name:&#x27;Voluntary water leasing&#x27;,cat:&#x27;Agriculture&#x27;,cost:2,water:3,eco:0,ag:-1,dust:0},
    {id:&#x27;fallow&#x27;,name:&#x27;Permanently fallow some agricultural land&#x27;,cat:&#x27;Agriculture&#x27;,cost:3,water:3,eco:-1,ag:-3,dust:-1},
    {id:&#x27;crops&#x27;,name:&#x27;Change to alternate crops&#x27;,cat:&#x27;Agriculture&#x27;,cost:2,water:2,eco:0,ag:0,dust:0},
    {id:&#x27;irrigation&#x27;,name:&#x27;Upgrade irrigation systems&#x27;,cat:&#x27;Agriculture&#x27;,cost:3,water:2,eco:0,ag:2,dust:0},
    {id:&#x27;phragmites&#x27;,name:&#x27;Control phragmites and restore native vegetation&#x27;,cat:&#x27;Habitat&#x27;,cost:4,water:2,eco:3,ag:0,dust:1},
    {id:&#x27;wetlands&#x27;,name:&#x27;Optimize wetland flooding&#x27;,cat:&#x27;Habitat&#x27;,cost:1,water:0,eco:2,ag:0,dust:0},
    {id:&#x27;habitat-conservation&#x27;,name:&#x27;Conserve habitat from development&#x27;,cat:&#x27;Habitat&#x27;,cost:2,water:0,eco:3,ag:1,dust:0},
    {id:&#x27;reuse&#x27;,name:&#x27;Wastewater reuse&#x27;,cat:&#x27;Infrastructure&#x27;,cost:4,water:0,eco:0,ag:0,dust:0,specialSupply:2,specialLake:-1,note:&#x27;+2 Basin Supply, −1 Lake&#x27;},
    {id:&#x27;berms&#x27;,name:&#x27;Use berms, causeways and impoundments to manage portions of the lake&#x27;,cat:&#x27;Infrastructure&#x27;,cost:3,water:0,eco:1,ag:0,dust:1},
    {id:&#x27;delivery&#x27;,name:&#x27;Reduce losses from delivery systems&#x27;,cat:&#x27;Infrastructure&#x27;,cost:3,water:1,eco:-1,ag:1,dust:0},
    {id:&#x27;storage&#x27;,name:&#x27;Increase storage capacity&#x27;,cat:&#x27;Infrastructure&#x27;,cost:4,water:0,eco:-1,ag:1,dust:0},
    {id:&#x27;dust-control&#x27;,name:&#x27;Suppress dust from exposed hot spots&#x27;,cat:&#x27;Infrastructure&#x27;,cost:5,water:-1,eco:0,ag:0,dust:2},
    {id:&#x27;turf&#x27;,name:&#x27;Replace turf with water-wise landscaping&#x27;,cat:&#x27;Municipal&#x27;,cost:3,water:2,eco:1,ag:0,dust:0},
    {id:&#x27;controllers&#x27;,name:&#x27;Improve watering efficiency&#x27;,cat:&#x27;Municipal&#x27;,cost:1,water:1,eco:0,ag:0,dust:0},
    {id:&#x27;new-landscape&#x27;,name:&#x27;Employ water-wise landscaping in new development&#x27;,cat:&#x27;Municipal&#x27;,cost:1,water:2,eco:1,ag:0,dust:0},
    {id:&#x27;institutional&#x27;,name:&#x27;Institutional conservation&#x27;,cat:&#x27;Municipal&#x27;,cost:2,water:1,eco:0,ag:0,dust:0},
    {id:&#x27;smaller-lots&#x27;,name:&#x27;Reduce irrigated area for new development&#x27;,cat:&#x27;Municipal&#x27;,cost:0,water:1,eco:1,ag:1,dust:0},
    {id:&#x27;indoor&#x27;,name:&#x27;Increase indoor water efficiency&#x27;,cat:&#x27;Municipal&#x27;,cost:1,water:0,eco:0,ag:0,dust:0},
    {id:&#x27;commercial&#x27;,name:&#x27;Commercial and light industrial conservation&#x27;,cat:&#x27;Municipal&#x27;,cost:2,water:1,eco:0,ag:0,dust:0},
    {id:&#x27;industrial&#x27;,name:&#x27;Industrial water efficiency&#x27;,cat:&#x27;Industry&#x27;,cost:3,water:1,eco:0,ag:0,dust:0},
    {id:&#x27;mining&#x27;,name:&#x27;Reduce mining-operation water depletions&#x27;,cat:&#x27;Industry&#x27;,cost:3,water:2,eco:1,ag:0,dust:0},
    {id:&#x27;reservoir&#x27;,name:&#x27;Modify seasonal reservoir operations&#x27;,cat:&#x27;Operations&#x27;,cost:1,water:0,eco:1,ag:1,dust:0},
    {id:&#x27;cloud&#x27;,name:&#x27;Cloud seeding&#x27;,cat:&#x27;Operations&#x27;,cost:0,water:1,eco:1,ag:1,dust:0,max:1}
  ];
  const futures = [
    {id:&#x27;drought&#x27;,name:&#x27;Extreme Drought&#x27;,delta:-4,lake:-2,supply:-2,description:&#x27;A sustained dry period sharply reduces reliable flows to both basin users and the Great Salt Lake.&#x27;},
    {id:&#x27;hot-dry&#x27;,name:&#x27;Hotter and Drier&#x27;,delta:-2,lake:-1,supply:-1,description:&#x27;Warmer conditions increase losses and reduce reliable water even when precipitation is near normal.&#x27;},
    {id:&#x27;early-runoff&#x27;,name:&#x27;Earlier Runoff&#x27;,delta:-2,lake:-1,supply:-1,description:&#x27;Earlier snowmelt reduces reservoir carryover and dependable late-season flows.&#x27;},
    {id:&#x27;wet&#x27;,name:&#x27;Wetter Period&#x27;,delta:2,lake:1,supply:1,description:&#x27;Cooler, wetter conditions improve basin supplies and flows reaching the lake.&#x27;}
  ];
  let selected = [];
  let lake = 0, supply = 0, waterFuture = null, adapted = false, adaptId = null, adaptLake = 0, adaptSupply = 0, phase = &#x27;build&#x27;, packageLocked = false;
  const completedSteps = new Set();
  const phaseOrder = [&#x27;build&#x27;,&#x27;shock&#x27;,&#x27;adapt&#x27;,&#x27;results&#x27;];
  const byId = id =&gt; strategies.find(s =&gt; s.id === id);
  const counts = () =&gt; selected.reduce((a,id)=&gt;(a[id]=(a[id]||0)+1,a),{});
  const eligibleAdaptStrategies = () =&gt; { const c=counts(); return strategies.filter(s=&gt;(c[s.id]||0)&lt;(s.max||2)); };
  const resetLaterStages = () =&gt; { waterFuture=null; adapted=false; adaptId=null; adaptLake=0; adaptSupply=0; };
  function totals(){ return selected.map(byId).reduce((a,s)=&gt;({cost:a.cost+s.cost,water:a.water+s.water,eco:a.eco+s.eco,ag:a.ag+s.ag,dust:a.dust+s.dust,specialSupply:a.specialSupply+(s.specialSupply||0),specialLake:a.specialLake+(s.specialLake||0)}),{cost:0,water:0,eco:0,ag:0,dust:0,specialSupply:0,specialLake:0}); }
  function scoreState(){
    const t=totals(), future=waterFuture||{lake:0,supply:0}, a=adapted?byId(adaptId):null;
    const currentLake=Math.max(0,lake+t.specialLake+future.lake+(a?.specialLake||0)+(a?adaptLake:0));
    const currentSupply=Math.max(0,supply+t.specialSupply+future.supply+(a?.specialSupply||0)+(a?adaptSupply:0));
    const cost=t.cost+(a?a.cost*2:0), baseEco=t.eco+(a?.eco||0), ag=t.ag+(a?.ag||0), baseDust=t.dust+(a?.dust||0);
    const packageComplete=selected.length===8;
    const bonus=packageComplete?(currentLake&lt;=5?-2:currentLake&lt;=9?0:currentLake&lt;=13?2:3):0;
    const eco=baseEco+bonus, dust=baseDust+bonus;
    const badges=[
      [&#x27;Cost conscious&#x27;,packageComplete&amp;&amp;cost&lt;=16],
      [&#x27;Supply resilient&#x27;,packageComplete&amp;&amp;currentSupply&gt;=6],
      [&#x27;Lake forward&#x27;,packageComplete&amp;&amp;currentLake&gt;=9],
      [&#x27;Ecosystem strong&#x27;,packageComplete&amp;&amp;eco&gt;=8],
      [&#x27;Agriculture supportive&#x27;,packageComplete&amp;&amp;ag&gt;=3],
      [&#x27;Clean air&#x27;,packageComplete&amp;&amp;dust&gt;=2],
      [&#x27;Balanced strategy&#x27;,packageComplete&amp;&amp;cost&lt;=20&amp;&amp;currentSupply&gt;=4&amp;&amp;currentLake&gt;=10&amp;&amp;eco&gt;=6&amp;&amp;ag&gt;=0&amp;&amp;dust&gt;=2]
    ];
    return {t,currentLake,currentSupply,cost,eco,ag,dust,bonus,badges,packageComplete};
  }
  function renderCards(){
    const filter = root.querySelector(&#x27;#basin-filter&#x27;).value;
    const c = counts();
    root.querySelector(&#x27;#basin-filter&#x27;).disabled=packageLocked;
    root.querySelector(&#x27;#basin-cards&#x27;).innerHTML = strategies.filter(s=&gt;s.cat===filter).map(s=&gt;{
      const count=c[s.id]||0, max=s.max||2, full=selected.length&gt;=8||packageLocked;
      const waterLabel=s.note||`Water ${s.water}`;
      return `&lt;article class=&quot;basin-strategy&quot; data-category=&quot;${s.cat}&quot;&gt;&lt;div&gt;&lt;strong&gt;${s.name}&lt;/strong&gt;&lt;small&gt;${s.cat}&lt;br&gt;Cost ${s.cost} · ${waterLabel} · Eco ${s.eco} · Ag ${s.ag} · Dust ${s.dust}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;basin-card-actions&quot;&gt;&lt;button type=&quot;button&quot; data-add=&quot;${s.id}&quot; ${(full||count&gt;=1)?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;+ Add&lt;/button&gt;&lt;button type=&quot;button&quot; data-double=&quot;${s.id}&quot; ${(full||count!==1||max===1)?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${count&gt;=2?&#x27;2× added&#x27;:&#x27;2×&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`;
    }).join(&#x27;&#x27;);
  }
  function renderSlots(){
    const slots = Array.from({length:8},(_,i)=&gt;selected[i]);
    const seen={};
    root.querySelector(&#x27;#basin-slots&#x27;).innerHTML = slots.map((id,i)=&gt;{
      if(!id) return `&lt;div class=&quot;basin-slot&quot;&gt;&lt;span class=&quot;slot-num&quot;&gt;${i+1}&lt;/span&gt;&lt;strong&gt;Open slot&lt;/strong&gt;&lt;small&gt;Choose together&lt;/small&gt;&lt;/div&gt;`;
      seen[id]=(seen[id]||0)+1;
      return `&lt;div class=&quot;basin-slot is-filled&quot;&gt;&lt;span class=&quot;slot-num&quot;&gt;${i+1}${seen[id]===2?&#x27; · 2× play&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;strong&gt;${byId(id).name}&lt;/strong&gt;&lt;small&gt;${byId(id).cat}&lt;/small&gt;&lt;button type=&quot;button&quot; data-remove=&quot;${i}&quot; aria-label=&quot;Remove ${byId(id).name}&quot; ${packageLocked?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;×&lt;/button&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    root.querySelector(&#x27;#basin-package-status&#x27;).textContent = `${selected.length} of 8 cards selected`;
  }
  function renderScore(){
    const s=scoreState(), t=s.t;
    root.querySelector(&#x27;#basin-water-total&#x27;).textContent=s.currentLake+s.currentSupply;
    root.querySelector(&#x27;#basin-lake&#x27;).textContent=s.currentLake;
    root.querySelector(&#x27;#basin-supply&#x27;).textContent=s.currentSupply;
    const allocationStatus=root.querySelector(&#x27;#basin-allocation-status&#x27;);
    allocationStatus.textContent=!packageLocked?&#x27;The first 4 points are preallocated to Basin Supply. Move any points as the group negotiates.&#x27;:waterFuture?`${waterFuture.name} is applied: ${waterFuture.lake&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${waterFuture.lake} Lake and ${waterFuture.supply&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${waterFuture.supply} Basin Supply.`:&#x27;Package locked. Draw the room’s water future below.&#x27;;
    const special=root.querySelector(&#x27;#basin-special-water&#x27;);
    special.hidden=!(t.specialSupply||t.specialLake);
    special.textContent=(t.specialSupply||t.specialLake)?`Strategy adjustment included: ${t.specialSupply&gt;=0?&#x27;+&#x27;:&#x27;&#x27;}${t.specialSupply} Basin Supply, ${t.specialLake&gt;=0?&#x27;+&#x27;:&#x27;&#x27;}${t.specialLake} Lake.`:&#x27;&#x27;;
    root.querySelectorAll(&#x27;[data-allocate]&#x27;).forEach(b=&gt;{
      const action=b.dataset.allocate;
      b.disabled=packageLocked||(action===&#x27;lake-minus&#x27;&amp;&amp;lake&lt;=0)||(action===&#x27;lake-plus&#x27;&amp;&amp;supply&lt;=0)||(action===&#x27;supply-minus&#x27;&amp;&amp;supply&lt;=0)||(action===&#x27;supply-plus&#x27;&amp;&amp;lake&lt;=0);
    });
    root.querySelector(&#x27;#basin-metrics&#x27;).innerHTML=[[&#x27;Cost&#x27;,s.cost],[&#x27;Lake&#x27;,s.currentLake],[&#x27;Basin supply&#x27;,s.currentSupply],[&#x27;Ecosystem health&#x27;,s.eco],[&#x27;Agriculture &amp; economy&#x27;,s.ag],[&#x27;Dust reduction&#x27;,s.dust]].map(x=&gt;`&lt;div class=&quot;basin-metric&quot;&gt;&lt;span&gt;${x[0]}&lt;/span&gt;&lt;strong&gt;${x[1]}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
    const g=root.querySelector(&#x27;#basin-guardrail&#x27;);
    const started=selected.length&gt;0, ok=s.currentSupply&gt;=4;
    g.classList.toggle(&#x27;is-fail&#x27;,started&amp;&amp;!ok);
    g.innerHTML=`&lt;i data-lucide=&quot;${!started?&#x27;circle-dashed&#x27;:ok?&#x27;shield-check&#x27;:&#x27;triangle-alert&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;${!started?&#x27;Begin by selecting strategies&#x27;:ok?&#x27;Basin needs currently met&#x27;:&#x27;Package fails basin needs&#x27;}&lt;/strong&gt;&lt;small&gt;Current supply is ${s.currentSupply}; it must remain at 4 or more.&lt;/small&gt;&lt;/div&gt;`;
    const lock=root.querySelector(&#x27;#basin-lock&#x27;);
    lock.hidden=packageLocked;
    lock.disabled=selected.length!==8;
    lock.textContent=selected.length===8?&#x27;Lock package &amp; continue&#x27;:`Select ${8-selected.length} more strateg${8-selected.length===1?&#x27;y&#x27;:&#x27;ies&#x27;} to continue`;
    const bonusKey=s.currentLake&lt;=5?&#x27;low&#x27;:s.currentLake&lt;=9?&#x27;neutral&#x27;:s.currentLake&lt;=13?&#x27;plus-two&#x27;:&#x27;plus-three&#x27;;
    root.querySelectorAll(&#x27;[data-bonus]&#x27;).forEach(row=&gt;row.classList.toggle(&#x27;is-current&#x27;,s.packageComplete&amp;&amp;row.dataset.bonus===bonusKey));
    root.querySelector(&#x27;#basin-live-badges&#x27;).innerHTML=s.badges.map(([name,earned])=&gt;`&lt;div class=&quot;basin-live-badge ${earned?&#x27;is-earned&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i aria-hidden=&quot;true&quot;&gt;${earned?&#x27;✓&#x27;:&#x27;○&#x27;}&lt;/i&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
    renderNavState();
    if(window.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  function renderNavState(){
    root.querySelectorAll(&#x27;.basin-steps button&#x27;).forEach((b,index)=&gt;{
      const step=b.dataset.step, complete=completedSteps.has(step);
      b.classList.toggle(&#x27;is-active&#x27;,step===phase);
      b.classList.toggle(&#x27;is-complete&#x27;,complete);
      b.disabled=step!==phase;
      b.querySelector(&#x27;span&#x27;).textContent=complete?&#x27;✓&#x27;:String(index+1);
    });
  }
  function rebalance(){
    const w=Math.max(0,totals().water);
    const current=lake+supply;
    if(current&lt;w){
      let added=w-current;
      const basinNeed=Math.max(0,4-supply);
      const toBasin=Math.min(added,basinNeed);
      supply+=toBasin;
      added-=toBasin;
      lake+=added;
    }
    if(current&gt;w){
      let removed=current-w;
      const fromLake=Math.min(lake,removed);
      lake-=fromLake;
      removed-=fromLake;
      supply=Math.max(0,supply-removed);
    }
  }
  function renderBuild(){ root.querySelector(&#x27;#basin-main&#x27;).hidden=false; root.querySelector(&#x27;#basin-phase&#x27;).hidden=true; renderCards();renderSlots();renderScore(); }
  function setStep(step){
    if(step!==phase){
      const canAdvance=(phase===&#x27;build&#x27;&amp;&amp;step===&#x27;shock&#x27;&amp;&amp;selected.length===8)||(phase===&#x27;shock&#x27;&amp;&amp;step===&#x27;adapt&#x27;&amp;&amp;waterFuture)||(phase===&#x27;adapt&#x27;&amp;&amp;step===&#x27;results&#x27;);
      if(!canAdvance) return;
      completedSteps.add(phase);
      if(phase===&#x27;build&#x27;) packageLocked=true;
      phase=step;
    }
    renderNavState();
    if(step===&#x27;build&#x27;){renderBuild();return;}
    root.querySelector(&#x27;#basin-main&#x27;).hidden=false;
    renderCards();
    renderSlots();
    const panel=root.querySelector(&#x27;#basin-phase&#x27;); panel.hidden=false;
    const t=totals();
    if(step===&#x27;shock&#x27;){
      if(!waterFuture){
        panel.innerHTML=`&lt;div class=&quot;basin-phase-grid&quot;&gt;&lt;div class=&quot;basin-event&quot;&gt;&lt;h2&gt;Draw this room’s water future&lt;/h2&gt;&lt;p&gt;The package is locked. This room will independently draw Extreme Drought, Hotter and Drier, Earlier Runoff, or Wetter Period.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;basin-primary&quot; data-draw-future&gt;Draw randomly for this room&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
      } else {
        panel.innerHTML=`&lt;div class=&quot;basin-phase-grid&quot;&gt;&lt;div class=&quot;basin-event&quot;&gt;&lt;h2&gt;Water future revealed&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;${waterFuture.name}&lt;/strong&gt; — ${waterFuture.description}&lt;/p&gt;&lt;div class=&quot;event-value ${waterFuture.delta&gt;0?&#x27;is-positive&#x27;:&#x27;&#x27;}&quot;&gt;${waterFuture.delta&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${waterFuture.delta} water&lt;/div&gt;&lt;div class=&quot;basin-split&quot;&gt;&lt;div&gt;&lt;span&gt;Lake&lt;/span&gt;&lt;strong&gt;${waterFuture.lake&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${waterFuture.lake}&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Basin supply&lt;/span&gt;&lt;strong&gt;${waterFuture.supply&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${waterFuture.supply}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lake and Basin Supply have updated immediately above and in the live score.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;basin-primary&quot; data-advance=&quot;adapt&quot;&gt;Continue to optional strategy&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
      }
      renderNavState();
    }
    if(step===&#x27;adapt&#x27;){
      const eligible=eligibleAdaptStrategies();
      if(!adaptId||!eligible.some(s=&gt;s.id===adaptId)){
        adaptId=eligible[0]?.id||null;
        adaptLake=Math.max(0,eligible[0]?.water||0);
        adaptSupply=0;
